<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Raquel Violeta">
        <meta name="description" content="Character counting web app">
        <meta name="keywords" content="Raquel Violeta, Rachel Violet, violetoolkit, Violet Toolkit, Ferramenta Violeta, ferramentavioleta, Toolkit Website, foss app, math exercises, math fun">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ferramenta Violeta</title>

        <link rel="icon" type="image/x-icon" href="./favicon.png">
        <link href="./css/layout.css" rel="stylesheet">
        <link href="./css/toolset.css" rel="stylesheet">
        <!-- <link href="./css/math.css" rel="stylesheet"> -->

        <script src="./js/theme.js"></script>
        <script src="./js/theme.js"></script>
        <script src="./js/ui.js"></script>
        <script src="./js/priceGame.js" defer></script>
    </head>
    <body onload="languageSwitch(false); themeSet(); document.getElementById('js-err').remove(); createMath();">
        <h1 id="js-err">(JAVASCRIPT_ERR) No JavaScript Detected</h1>
        <div id="top-right">
            <button id="l-eng" class="ub1" onclick="languageSwitch('en')">English</button>
            <button id="l-por" class="ub2" onclick="languageSwitch('br')">Português</button>
        </div>

        <button id="return" onclick="window.open('./index.html', '_self')">&lt;-- (ESC)</button>
        <div>
            <div id="exercises">
                <p id="score"></p>
                <p id="equation"></p>
                <button id="cur-real" onclick="curUpdate(0)">R$</button>
                <button id="cur-dollar" onclick="curUpdate(1)">$</button>
                <input id="answer" type="number">
                <button id="enter" onclick="answerQuestion()">ENTER</button>
                <p id="notepad-text"></p>
                <input type="text" id="notepad-area">
            </div>
        </div>
    </body>
</html>
